name: GCF-400 quality gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          for file in gcf-engine.js scan-core.js audit-utils.js security-seal.js security-ui.js pdf-bridge.js pdf-export.js document-bridge.js audit-app.js quality-app.js sheet-app.js calc-app.js nav.js offline-app.js quick-verify.js sw.js; do node --check "$file"; done
      - name: Date and PRC regressions
        run: |
          node tests/regression.js
          node tests/prc-fixtures.js
      - name: Security and audit evidence
        run: node tests/hardening.js
      - name: Signed evidence tamper and source integrity tests
        run: node tests/security-seal.js
      - name: Persistent non-exportable signing keys
        run: node tests/persistent-key.js
      - name: Automatic signed report ZIP and direct ZIP verification
        run: node tests/automatic-proof.js
      - name: Real Chromium upload, report ZIP and tamper verification
        run: node tests/browser-e2e-proof.js
      - name: Security UI fingerprint wrapping and copy
        run: node tests/security-ui.js
      - name: Security policy, safe cache and verifier accessibility
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          assert.ok(html.includes('Content-Security-Policy'));
          assert.ok(html.includes("object-src 'none'"));
          assert.ok(html.includes("script-src 'self'"));
          assert.ok(!html.includes("script-src 'unsafe-inline'"));
          assert.ok(html.includes('./security-seal.js'));
          assert.ok(html.includes('id="trustedKeyFingerprint"'));
          assert.ok(html.includes('id="downloadSignedManifest"'));
          assert.ok(html.includes('id="createDeviceSigner"'));
          assert.ok(html.includes('id="loadDeviceSigner"'));
          assert.ok(html.includes('id="eraseDeviceSigner"'));
          assert.ok(html.includes('./security-ui.js'));
          assert.ok(html.includes('id="deviceFingerprintValue"'));
          assert.ok(html.includes('id="verificationFingerprintValue"'));
          assert.ok(html.includes('id="verifyEvidenceFile"'));
          assert.ok(html.includes('id="verifySourceFile"'));
          assert.ok(html.indexOf('id="verifyEvidenceFile"')<html.indexOf('id="results"'),'Independent verifier must be available without scanning');
          const sw=fs.readFileSync('sw.js','utf8');
          assert.ok(sw.includes("'./security-seal.js'"));
          assert.ok(sw.includes('if(url.origin!==self.location.origin)return'));
          assert.ok(sw.includes('if(!isShell&&request.mode!=='));
          console.log('Security policy and independent verifier accessibility PASS');
          NODE
      - name: Document audit UI smoke
        run: node tests/ui-smoke.js
      - name: Simplified end-user workflow and markup
        run: node tests/simplified-ui.js
      - name: Mobile and desktop layout check
        run: node tests/browser-layout.js
      - name: Offline calculator and private-request safety
        run: node tests/offline.js
      - name: One-line verification and ambiguity tests
        run: node tests/quick-verify.js
      - name: Independent calendar and OCR disagreement safeguards
        run: node tests/cross-checks.js
      - name: Offline shell assets and PWA references
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          for(const item of ['rel="manifest"','./offline-app.js','id="offlineStatus"','id="calcToday"','id="calcCopy"','id="quickInput"','./quick-verify.js'])assert.ok(html.includes(item),item+' missing');
          const sw=fs.readFileSync('sw.js','utf8');
          assert.ok(sw.includes("'./calc-app.js'"));
          assert.ok(sw.includes("'./gcf-engine.js'"));
          assert.ok(sw.includes("'./offline-app.js'"));
          const manifest=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          assert.ok(manifest.icons.length>=1);
          for(const entry of manifest.icons)assert.ok(fs.existsSync(entry.src.replace(/^\.\//,'')));
          console.log('Offline PWA references PASS');
          NODE
